name: Rebuild Dashboard
on:
  push:
    branches: [repair-dashboard-freshness]
    paths: [.github/workflows/rebuild-dashboard.yml]
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Generate dashboard from stored data
        run: python -m dashboard.generate
      - name: Verify and commit refreshed dashboard
        run: |
          python - <<'PYTHON'
          import json, re
          from datetime import datetime, timezone
          from pathlib import Path
          from dashboard.generate import load_records
          html = Path('docs/index.html').read_text(encoding='utf-8')
          stamp = re.search(r'Generated ([0-9T:+.-]+)', html)
          assert stamp, 'Dashboard timestamp missing'
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(stamp[1])).total_seconds()
          assert 0 <= age < 900, 'Dashboard is stale'
          payload = re.search(r'<script type="application/json" id="data">(.*?)</script>', html, re.S)
          assert payload and json.loads(payload[1]) == load_records(), 'Dashboard data mismatch'
          PYTHON
          git config user.name 'media-monitor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet || git commit -m 'Refresh dashboard from stored data'
          git push

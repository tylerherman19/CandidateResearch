name: Daily Sweep

on:
  schedule:
    # 11:07 UTC daily -- roughly 5-6am Central depending on DST. Never :00,
    # per queue-delay gotcha. GitHub Actions cron is UTC-only; adjust here
    # if you want a different local wall-clock time.
    - cron: "7 11 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # lets the default GITHUB_TOKEN push the data commit below
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No PAT needed: the default GITHUB_TOKEN (via `permissions:` above)
        # is enough to check out and push within this run. The one thing it
        # does NOT do is count as "activity" for GitHub's 60-day scheduled-
        # workflow auto-disable -- if this repo goes 60+ days with no other
        # human-initiated activity, re-trigger it manually (Actions tab ->
        # Run workflow) or add a GH_PAT secret and reference it as
        # `token: ${{ secrets.GH_PAT }}` here to make bot commits count too.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sweep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          META_AD_LIBRARY_TOKEN: ${{ secrets.META_AD_LIBRARY_TOKEN }}
        run: python run.py

      - name: Commit updated data
        run: |
          git config user.name "media-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: sweep $(date -u +%F)"
          git push

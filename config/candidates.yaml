candidates:
  - id: martinez_rutherford
    name: "Dina Nina Martinez Rutherford"
    aliases:
      - "Dina Nina"
      - "Dina Nina Martinez-Rutherford"
    office: "WI State Assembly, District 76"
    require_any:
      - "Wisconsin"
      - "Assembly"
      - "District 76"
      - "AD 76"
      - "Madison"
      - "76th"
    exclude_any: []
    # Terms specific enough to this exact race that they're accepted on their
    # own, without a name match -- for when a source only gives us a headline
    # (Google News RSS has no real snippet, so a real name mention buried in
    # the article body is invisible to us; see resolve.py). Unlike "Madison"/
    # "Wisconsin" alone, these can't plausibly be about something else.
    race_context_terms:
      - "76th Assembly District"
      - "District 76"
      - "AD 76"
      - "76th District"
      - "Francesca Hong"  # outgoing AD76 incumbent -- articles about her successor are this race

